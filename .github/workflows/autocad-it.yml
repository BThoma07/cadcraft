# CADCraft, edizione italiana stile AutoCAD: prova il codice, salva le schermate della finestra e
# crea l'installatore per Windows (.msi) e la versione portatile (.zip) da scaricare e condividere.
name: Edizione AutoCAD IT

on:
  push:
    branches: [autocad-it]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: autocad-it-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: never
  CARGO_INCREMENTAL: 0

jobs:
  test:
    name: Prove e schermate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Librerie di sistema (grafica software per le schermate)
        run: sudo apt-get update && sudo apt-get install -y mesa-vulkan-drivers libxkbcommon-dev libgtk-3-dev
      - name: Prove dei comandi italiani e della finestra
        env:
          CRAFT_UI_VISUAL_DIR: ${{ github.workspace }}/schermate
        shell: bash
        run: |
          set -o pipefail
          rc=0
          for t in "-p cadcraft-engine --lib italiano" "-p cadcraft-engine --test aliases" "-p cadcraft-ui-egui --test autocad_edition" "-p cadcraft-ui-egui --test alias_dialog" "-p cadcraft-ui-egui --lib ribbon" "-p cadcraft-ui-egui --lib cmdline"; do
            echo "=== cargo test $t"
            cargo test $t 2>&1 | tee -a prove.log || rc=1
          done
          # The failures as annotations, readable without logging in.
          grep -E -A3 "panicked at|^error(\[|:)|assertion|left:|right:|---- .* stdout ----" prove.log | grep -v "^--$" | head -80 | while IFS= read -r l; do echo "::error::$l"; done || true
          # Nothing matched but something failed: the last lines tell why.
          if [ $rc -ne 0 ]; then grep -v "^\s*$" prove.log | tail -25 | while IFS= read -r l; do echo "::warning::$l"; done || true; fi
          exit $rc
      - name: Velocità mentre si disegna (tempo per fotogramma, solo informativa)
        continue-on-error: true
        shell: bash
        run: |
          cargo test --release -p cadcraft-ui-egui --test velocita_disegno -- --nocapture 2>&1 | tee velocita.log | tail -40
          grep -E "ms|risparmio|error" velocita.log | head -30 | while IFS= read -r l; do echo "::notice::$l"; done || true
      - name: Tutte le altre prove (solo informative)
        continue-on-error: true
        run: cargo test -p cadcraft-engine -p cadcraft-ui-egui 2>&1 | tail -150
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: schermate
          path: schermate/*.png
          if-no-files-found: warn
      # The screenshots on their own branch too, so they can be fetched with git alone
      # (pushed with the checkout's own credentials).
      - name: Schermate sul ramo schermate-ci
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          [ -d schermate ] || exit 0
          tmp=$(mktemp -d)
          cp schermate/*.png "$tmp"/ 2>/dev/null || true
          cp velocita.log "$tmp"/ 2>/dev/null || true
          git checkout -q --orphan schermate-ci
          git rm -r -q --cached . >/dev/null
          git clean -fdq -e target
          cp "$tmp"/* .
          git add -f *.png velocita.log 2>/dev/null || git add -f *.png
          git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -qm "Schermate di ${GITHUB_SHA}"
          git push -q -f origin schermate-ci || true
          git checkout -q -f "$GITHUB_SHA"

  windows:
    name: Installatore Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
      - name: WiX (installatore .msi)
        shell: pwsh
        run: |
          dotnet tool install --global wix --version 5.0.2
          wix extension add -g WixToolset.UI.wixext/5.0.2
      - name: Compila e crea l'installatore
        shell: pwsh
        env:
          CADCRAFT_VERSION: 0.9.0-it.${{ github.run_number }}
        run: |
          pwsh packaging/windows/package.ps1 -Arch x64 2>&1 | Tee-Object -FilePath build.log
          $code = $LASTEXITCODE
          Select-String -Path build.log -Pattern '^error' -Context 0,4 | Select-Object -First 15 | ForEach-Object { Write-Output "::error::$($_.Line) $($_.Context.PostContext -join ' | ')" }
          if ($code -ne 0 -or -not (Test-Path dist/release)) { exit 1 }
      - uses: actions/upload-artifact@v4
        with:
          name: CADCraft-IT-Windows
          path: dist/release/*
      - name: Pubblica la versione da scaricare
        uses: softprops/action-gh-release@v2
        with:
          tag_name: it-${{ github.run_number }}
          name: CADCraft edizione italiana (stile AutoCAD) n. ${{ github.run_number }}
          make_latest: true
          body: |
            Installatore per Windows: scarica il file `.msi` qui sotto e aprilo.
            In alternativa, il file `-portable.zip` non richiede installazione.
          files: dist/release/*
